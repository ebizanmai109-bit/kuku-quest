<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九のぼうけん - レトロRPG</title>
    <!-- レトロ風フォント（ドット絵風に見せるためのスタイル） -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        :root {
            --bg-color: #111111;
            --screen-bg: #1a1a2e;
            --border-color: #ffffff;
            --accent-color: #ffcc00;
            --danger-color: #ff4444;
            --success-color: #44ff44;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DotGothic16', monospace, sans-serif;
            image-rendering: pixelated;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* ファミコンの画面フレーム風 */
        .arcade-cabinet {
            width: 100%;
            max-width: 480px;
            background-color: #222;
            border: 4px solid #555;
            box-shadow: 0 0 0 4px #000, 0 15px 30px rgba(0,0,0,0.8);
            border-radius: 4px;
            padding: 12px;
            position: relative;
        }

        /* 上部ステータスバー（BGM切り替えなど） */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000;
            border: 2px solid #555;
            padding: 6px 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .bgm-toggle-btn {
            background: #444;
            color: #fff;
            border: 2px solid #888;
            padding: 2px 8px;
            cursor: pointer;
            font-family: 'DotGothic16';
            font-size: 0.8rem;
        }
        .bgm-toggle-btn.active {
            background: #00aa00;
            border-color: #55ff55;
        }

        .screen {
            display: none;
            width: 100%;
            background-color: var(--screen-bg);
            border: 4px solid var(--border-color);
            padding: 20px 15px;
            text-align: center;
            flex-direction: column;
            align-items: center;
            min-height: 480px;
            justify-content: space-between;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            text-shadow: 3px 3px #000;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 20px;
        }

        /* レトロ風ドットボタン */
        .retro-btn {
            background-color: #333;
            color: #fff;
            border: 3px solid #fff;
            box-shadow: inset -3px -3px 0px #111, inset 3px 3px 0px #666;
            padding: 14px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-family: 'DotGothic16';
            text-transform: uppercase;
            transition: none;
        }

        .retro-btn:active {
            box-shadow: inset 3px 3px 0px #111;
            transform: translate(2px, 2px);
        }

        .retro-btn.primary {
            background-color: #aa0000;
            border-color: #ff5555;
            box-shadow: inset -3px -3px 0px #550000, inset 3px 3px 0px #ff8888;
        }

        .retro-btn.secondary {
            background-color: #006666;
            border-color: #44ffff;
            box-shadow: inset -3px -3px 0px #003333, inset 3px 3px 0px #88ffff;
        }

        .home-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin: auto 0;
        }

        /* ステージ選択・準備セレクトリスト */
        .stage-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-height: 320px;
            overflow-y: auto;
            border: 2px solid #555;
            background: #000;
            padding: 5px;
            text-align: left;
        }

        .stage-item {
            background-color: #111;
            border: 2px solid #444;
            color: #fff;
            padding: 10px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'DotGothic16';
        }

        .stage-item.unlocked {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: #222200;
        }

        .stage-item.locked {
            color: #666;
            border-color: #333;
            cursor: not-allowed;
        }

        .stage-item.cleared::after {
            content: " ★";
            color: #ffcc00;
        }

        .battle-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #555;
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .back-home-btn {
            background: none;
            border: 1px solid #aaa;
            color: #aaa;
            padding: 4px 8px;
            cursor: pointer;
            font-family: 'DotGothic16';
        }

        /* ドット絵キャラクターウィンドウ */
        .field-box {
            background: #000;
            border: 4px ridge #666;
            width: 100%;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
        }

        .dot-graphic {
            font-size: 3.5rem;
            animation: dot-bounce 1s infinite steps(2);
        }

        @keyframes dot-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .dot-graphic.hit {
            transform: scale(1.2) rotate(15deg);
            filter: invert(1);
        }

        /* HP/プログレスバー風 */
        .pixel-gauge-bg {
            width: 80%;
            background: #333;
            border: 2px solid #fff;
            height: 12px;
            margin-top: 10px;
            position: relative;
        }
        .pixel-gauge-fill {
            background: var(--success-color);
            height: 100%;
            width: 0%;
            transition: width 0.2s;
        }

        /* 問題カード */
        .rpg-window {
            background: #000;
            border: 4px solid #fff;
            box-shadow: inset 0 0 0 2px #000;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            text-align: center;
        }

        .rpg-kana {
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-bottom: 4px;
            min-height: 24px;
        }

        .rpg-problem {
            font-size: 2rem;
            color: #fff;
            letter-spacing: 2px;
        }

        /* 入力画面 */
        .input-screen-box {
            background: #111;
            border: 2px solid #888;
            color: #ffcc00;
            font-size: 1.5rem;
            padding: 6px;
            width: 100%;
            margin-bottom: 10px;
            letter-spacing: 6px;
            min-height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* キーパッド (ファミコンコントローラー風) */
        .pixel-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            margin-bottom: 10px;
        }

        .pixel-key {
            background: #444;
            color: #fff;
            border: 2px solid #888;
            box-shadow: inset -2px -2px 0px #222, inset 2px 2px 0px #666;
            padding: 10px 0;
            font-size: 1.4rem;
            font-family: 'DotGothic16';
            cursor: pointer;
        }
        .pixel-key:active {
            box-shadow: inset 2px 2px 0px #222;
        }
        .pixel-key.clear-key {
            background: #622;
            border-color: #f55;
            grid-column: span 2;
        }

        /* フラッシュカード（練習用） */
        .flashcard-box {
            background: #000;
            border: 4px solid var(--accent-color);
            width: 100%;
            padding: 25px 15px;
            margin: 15px 0;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(255,204,0,0.2);
        }

        #popup-msg {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background-color: #000;
            color: var(--accent-color);
            border: 4px solid #fff;
            font-size: 2rem;
            padding: 15px 25px;
            z-index: 999;
            transition: transform 0.1s;
        }
        #popup-msg.show {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <div id="popup-msg">せいかい！</div>

    <div class="arcade-cabinet">
        <!-- 上部コントロール：BGM切り替え -->
        <div class="top-bar">
            <span>🎵 ファミコンちびっ子BGM</span>
            <button id="bgm-btn" class="bgm-toggle-btn" onclick="toggleBGM()">BGM: OFF</button>
        </div>

        <!-- ① スタート画面（家の中・タイトル） -->
        <div id="start-screen" class="screen active">
            <div>
                <h1>九九のぼうけん</h1>
                <p class="subtitle">-- RETRO KUKU RPG --</p>
            </div>
            <div class="field-box">
                <div class="dot-graphic">🏠✨</div>
                <p style="font-size: 0.9rem; color: #aaa; margin-top: 5px;">セーブデータ けんしょうずみ</p>
            </div>
            <button class="retro-btn primary" onclick="startApp()">ゲームをはじめる</button>
        </div>

        <!-- ② ホーム画面（家の中） -->
        <div id="home-screen" class="screen">
            <div>
                <h1>ゆう者のいえ</h1>
                <p class="subtitle">きょうも九九の修業じゃ！</p>
            </div>
            <div class="field-box">
                <div class="dot-graphic">🧑‍💻📜</div>
                <p style="font-size: 0.9rem; color: #8ef;">タンスのなかに 九九のきおく</p>
            </div>
            <div class="home-menu">
                <button class="retro-btn primary" onclick="showStageSelect()">⚔️ ぼうけんにでる</button>
                <button class="retro-btn secondary" onclick="showPracticeStageSelect()">📖 ぼうけんのじゅんびをする</button>
            </div>
        </div>

        <!-- ③ ぼうけん ステージセレクト -->
        <div id="stage-select-screen" class="screen">
            <div class="battle-header">
                <button class="back-home-btn" onclick="showHome()">◀ もどる</button>
                <span>フィールドせんたく</span>
                <span></span>
            </div>
            <div class="stage-list" id="stage-list-container"></div>
            <button class="retro-btn" onclick="showHome()" style="margin-top: 10px;">いえに かえる</button>
        </div>

        <!-- ④ じゅんび（練習）セレクト -->
        <div id="practice-stage-select-screen" class="screen">
            <div class="battle-header">
                <button class="back-home-btn" onclick="showHome()">◀ もどる</button>
                <span>じゅんびするだん</span>
                <span></span>
            </div>
            <div class="stage-list" id="practice-stage-list-container"></div>
            <button class="retro-btn" onclick="showHome()" style="margin-top: 10px;">いえに かえる</button>
        </div>

        <!-- ⑤ 練習（フラッシュカード）画面 -->
        <div id="practice-screen" class="screen">
            <div class="battle-header">
                <button class="back-home-btn" onclick="showPracticeStageSelect()">◀ やめる</button>
                <span id="practice-stage-title">2の段のじゅんび</span>
                <span id="practice-counter">1/9</span>
            </div>

            <div class="flashcard-box" onclick="onFlashcardClick()">
                <div class="rpg-kana" id="practice-kana">にいちが</div>
                <div class="rpg-problem" id="practice-main" style="font-size: 2.5rem;">2 × 1</div>
                <p style="font-size: 0.8rem; color: #888; margin-top: 15px;">[ 画面をタッチしてこたえ／つぎへ ]</p>
            </div>

            <button class="retro-btn secondary" onclick="playPracticeCurrentAudio()" style="font-size: 1rem; padding: 10px;">🔊 音声をもういちどきく</button>
        </div>

        <!-- ⑥ バトル（冒険）画面 -->
        <div id="battle-screen" class="screen">
            <div class="battle-header">
                <button class="back-home-btn" onclick="showStageSelect()">◀ にげる</button>
                <span id="current-stage-title">2の段の森</span>
                <span id="question-counter">1/9</span>
            </div>

            <div class="field-box" id="battle-field-box">
                <div class="dot-graphic" id="monster-emoji">🟢</div>
                <div class="pixel-gauge-bg">
                    <div class="pixel-gauge-fill" id="battle-progress"></div>
                </div>
            </div>

            <div class="rpg-window">
                <div class="rpg-kana" id="kana-display">にいちが</div>
                <div class="rpg-problem" id="problem-display">2 × 1</div>
            </div>

            <div class="input-screen-box" id="user-input-display">-</div>

            <div class="pixel-keypad">
                <button class="pixel-key" onclick="inputNumber(1)">1</button>
                <button class="pixel-key" onclick="inputNumber(2)">2</button>
                <button class="pixel-key" onclick="inputNumber(3)">3</button>
                <button class="pixel-key" onclick="inputNumber(4)">4</button>
                <button class="pixel-key" onclick="inputNumber(5)">5</button>
                <button class="pixel-key" onclick="inputNumber(6)">6</button>
                <button class="pixel-key" onclick="inputNumber(7)">7</button>
                <button class="pixel-key" onclick="inputNumber(8)">8</button>
                <button class="pixel-key" onclick="inputNumber(9)">9</button>
                <button class="pixel-key clear-key" onclick="clearInput()">けす</button>
                <button class="pixel-key" onclick="inputNumber(0)">0</button>
            </div>
        </div>

        <!-- ⑦ クリア画面 -->
        <div id="result-screen" class="screen" style="justify-content: center;">
            <h1 style="color: #ffcc00;">ステージクリア！</h1>
            <div class="dot-graphic" style="margin: 20px 0;">🏆✨</div>
            <div class="rpg-window" style="margin: 15px 0;">
                <p style="font-size: 1rem; color: #aaa;">かかった時間</p>
                <p class="rpg-problem" id="clear-time-display" style="color: #55ff55; margin-top: 5px;">0秒</p>
            </div>
            <button class="retro-btn primary" onclick="showStageSelect()">ステージせんたくへ</button>
        </div>
    </div>

    <script>
        // --- Web Audio API によるファミコン風BGMジェネレーター ---
        let audioCtx = null;
        let bgmTimer = null;
        let bgmEnabled = false;
        let currentBgmMode = 'home'; // 'home', 'practice', 'battle'

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleBGM() {
            initAudioContext();
            bgmEnabled = !bgmEnabled;
            const btn = document.getElementById('bgm-btn');
            if (bgmEnabled) {
                btn.textContent = "BGM: ON";
                btn.classList.add('active');
                playBGM(currentBgmMode);
            } else {
                btn.textContent = "BGM: OFF";
                btn.classList.remove('active');
                stopBGM();
            }
        }

        function stopBGM() {
            if (bgmTimer) {
                clearInterval(bgmTimer);
                bgmTimer = null;
            }
        }

        function playTone(freq, duration, type = 'square', vol = 0.05) {
            if (!bgmEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // シーン別のファミコン風ループメロディ
        function playBGM(mode) {
            currentBgmMode = mode;
            stopBGM();
            if (!bgmEnabled) return;

            let step = 0;
            // メロディの音階データ (Hz)
            let melody = [];
            let tempo = 250;

            if (mode === 'home') {
                // 穏やかな家の中のテーマ（レトロRPG風）
                melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 329.63, 349.23, 329.63, 293.66, 261.63, 220.00, 246.94, 261.63, 0];
                tempo = 280;
            } else if (mode === 'practice') {
                // 練習用・のんびりとした音色
                melody = [330.00, 392.00, 440.00, 493.88, 440.00, 392.00, 330.00, 293.66, 330.00, 392.00, 330.00, 261.63];
                tempo = 320;
            } else if (mode === 'battle') {
                // 冒険・戦闘用のアップテンポなリズム
                melody = [220.00, 220.00, 329.63, 220.00, 196.00, 220.00, 246.94, 261.63, 293.66, 329.63, 293.66, 261.63, 246.94, 220.00, 196.00, 164.81];
                tempo = 180;
            }

            bgmTimer = setInterval(() => {
                if (!bgmEnabled) return;
                const freq = melody[step % melody.length];
                if (freq > 0) {
                    playTone(freq, tempo / 1000 * 0.8, mode === 'battle' ? 'sawtooth' : 'square', 0.03);
                }
                step++;
            }, tempo);
        }


        // --- 九九データ＆ゲーム進行ロジック ---
        const kukuData = {
            1: {
                1: { first: "いんいちが", second: "いち" },
                2: { first: "いちにが", second: "に" },
                3: { first: "いちさんが", second: "さん" },
                4: { first: "いちしが", second: "し" },
                5: { first: "いちごが", second: "ご" },
                6: { first: "いちろくが", second: "ろく" },
                7: { first: "いちしちが", second: "しち" },
                8: { first: "いちはちが", second: "はち" },
                9: { first: "いんくが", second: "く" }
            },
            2: {
                1: { first: "にいちが", second: "に" },
                2: { first: "ににんが", second: "し" },
                3: { first: "にさんが", second: "ろく" },
                4: { first: "にしが", second: "はち" },
                5: { first: "にご", second: "じゅう" },
                6: { first: "にろく", second: "じゅうに" },
                7: { first: "にしち", second: "じゅうし" },
                8: { first: "にはち", second: "じゅうろく" },
                9: { first: "にく", second: "じゅうはち" }
            },
            3: {
                1: { first: "さんいちが", second: "さん" },
                2: { first: "さんにが", second: "ろく" },
                3: { first: "さざんが", second: "く" },
                4: { first: "さんし", second: "じゅうに" },
                5: { first: "さんご", second: "じゅうご" },
                6: { first: "さぶろく", second: "じゅうはち" },
                7: { first: "さんしち", second: "にじゅういち" },
                8: { first: "さんぱ", second: "にじゅうし" },
                9: { first: "さんく", second: "にじゅうしち" }
            },
            4: {
                1: { first: "しいちが", second: "し" },
                2: { first: "しにが", second: "はち" },
                3: { first: "しさん", second: "じゅうに" },
                4: { first: "しし", second: "じゅうろく" },
                5: { first: "しご", second: "にじゅう" },
                6: { first: "しろく", second: "にじゅうし" },
                7: { first: "ししち", second: "にじゅうはち" },
                8: { first: "しは", second: "さんじゅうに" },
                9: { first: "しく", second: "さんじゅうろく" }
            },
            5: {
                1: { first: "ごいちが", second: "ご" },
                2: { first: "ごに", second: "じゅう" },
                3: { first: "ごさん", second: "じゅうご" },
                4: { first: "ごし", second: "にじゅう" },
                5: { first: "ごご", second: "にじゅうご" },
                6: { first: "ごろく", second: "さんじゅう" },
                7: { first: "ごしち", second: "さんじゅうご" },
                8: { first: "ごは", second: "しじゅう" },
                9: { first: "ごっく", second: "しじゅうご" }
            },
            6: {
                1: { first: "ろくいちが", second: "ろく" },
                2: { first: "ろくに", second: "じゅうに" },
                3: { first: "ろくさん", second: "じゅうはち" },
                4: { first: "ろくし", second: "にじゅうし" },
                5: { first: "ろくご", second: "さんじゅう" },

                7: { first: "ろくしち", second: "しじゅうに" },
                8: { first: "ろくは", second: "しじゅうはち" },
                9: { first: "ろっく", second: "ごじゅうし" }
            },
            7: {
                1: { first: "しちいちが", second: "しち" },
                2: { first: "しちに", second: "じゅうし" },
                3: { first: "しちさん", second: "にじゅういち" },
                4: { first: "しちし", second: "にじゅうはち" },
                5: { first: "しちご", second: "さんじゅうご" },
                6: { first: "しちろく", second: "しじゅうに" },
                7: { first: "しちしち", second: "しじゅうく" },
                8: { first: "しちは", second: "ごじゅうろく" },
                9: { first: "しちく", second: "ろくじゅうさん" }
            },
            8: {
                1: { first: "はちいちが", second: "はち" },
                2: { first: "はちに", second: "じゅうろく" },
                3: { first: "はちさん", second: "にじゅうし" },
                4: { first: "はちし", second: "さんじゅうに" },
                5: { first: "はちご", second: "しじゅう" },
                6: { first: "はちろく", second: "しじゅうはち" },
                7: { first: "はちしち", second: "ごじゅうろく" },
                8: { first: "はっぱ", second: "ろくじゅうし" },
                9: { first: "はっく", second: "しちじゅうに" }
            },
            9: {
                1: { first: "くいちが", second: "く" },
                2: { first: "くに", second: "じゅうはち" },
                3: { first: "くさん", second: "にじゅうしち" },
                4: { first: "くし", second: "さんじゅうろく" },
                5: { first: "くご", second: "しじゅうご" },
                6: { first: "くろく", second: "ごじゅうし" },
                7: { first: "くしち", second: "ろくじゅうさん" },
                8: { first: "くは", second: "しちじゅうに" },
                9: { first: "くく", second: "はちじゅういち" }
            }
        };

        const STAGE_ORDER = [1, 2, 5, 3, 4, 6, 7, 8, 9];
        const STAGE_NAMES = {
            1: "1の段 (はじまりの原っぱ)",
            2: "2の段 (はじまりの森)",
            5: "5の段 (しずかな平原)",
            3: "3の段 (いばらの林)",
            4: "4の段 (まがった洞窟)",
            6: "6の段 (大きな山道)",
            7: "7の段 (ひみつの谷)",
            8: "8の段 (吹雪の雪原)",
            9: "9の段 (竜の城門)"
        };
        const MONSTER_ICONS = ["🟡", "🟢", "👺", "💀", "👻", "👹", "🗿", "🦅", "🐲"];

        let saveData = JSON.parse(localStorage.getItem('kuku_save_data')) || {
            unlockedStages: [1],
            clearedStages: []
        };

        let currentStage = 1;
        let currentMultiplierIndex = 0;
        let currentAudio = null;
        let startTime = 0;
        let userInputString = "";
        let problemsQueue = [];
        let isAnswered = false;

        let practiceStage = 1;
        let practiceIndex = 0;
        let flashcardState = 0; // 0: 問題, 1: 答え

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startApp() {
            initAudioContext();
            showHome();
        }

        function showHome() {
            playBGM('home');
            switchScreen('home-screen');
        }

        // --- 冒険ステージ ---
        function showStageSelect() {
            playBGM('home');
            const container = document.getElementById('stage-list-container');
            container.innerHTML = '';

            STAGE_ORDER.forEach((stageNum) => {
                const isUnlocked = saveData.unlockedStages.includes(stageNum);
                const isCleared = saveData.clearedStages.includes(stageNum);

                const btn = document.createElement('div');
                btn.className = `stage-item ${isUnlocked ? 'unlocked' : 'locked'} ${isCleared ? 'cleared' : ''}`;
                btn.textContent = STAGE_NAMES[stageNum] + (isUnlocked ? "" : " [🔒]");
                
                if (isUnlocked) {
                    btn.onclick = () => startBattle(stageNum);
                }
                container.appendChild(btn);
            });
            switchScreen('stage-select-screen');
        }

        function startBattle(stageNum) {
            currentStage = stageNum;
            currentMultiplierIndex = 0;
            isAnswered = false;
            playBGM('battle');

            problemsQueue = [];
            for (let b = 1; b <= 9; b++) {
                problemsQueue.push({ a: currentStage, b: b });
            }

            document.getElementById('current-stage-title').textContent = STAGE_NAMES[currentStage].split(' ')[0];
            const stageIdx = STAGE_ORDER.indexOf(currentStage);
            document.getElementById('monster-emoji').textContent = MONSTER_ICONS[stageIdx] || "🐲";
            document.getElementById('monster-emoji').classList.remove('hit');

            switchScreen('battle-screen');
            startTime = Date.now();
            loadCurrentProblem();
        }

        function loadCurrentProblem() {
            isAnswered = false;
            userInputString = "";
            updateInputDisplay();

            const prob = problemsQueue[currentMultiplierIndex];
            document.getElementById('question-counter').textContent = `${currentMultiplierIndex + 1}/9`;
            document.getElementById('battle-progress').style.width = `${(currentMultiplierIndex / 9) * 100}%`;
            document.getElementById('problem-display').textContent = `${prob.a} × ${prob.b}`;

            if (kukuData[prob.a] && kukuData[prob.a][prob.b]) {
                document.getElementById('kana-display').textContent = kukuData[prob.a][prob.b].first;
            }
            playFirstAudio();
        }

        function playFirstAudio() {
            if (isAnswered) return;
            const prob = problemsQueue[currentMultiplierIndex];
            const audioPath = `audio/${prob.a}-${prob.b}_1.wav`;
            if (currentAudio) { currentAudio.pause(); }
            currentAudio = new Audio(audioPath);
            currentAudio.play().catch(e => {});
        }

        function playSecondAudio(callback) {
            const prob = problemsQueue[currentMultiplierIndex];
            const audioPath = `audio/${prob.a}-${prob.b}_2.wav`;
            if (currentAudio) { currentAudio.pause(); }
            currentAudio = new Audio(audioPath);
            currentAudio.play().then(() => {
                currentAudio.onended = () => { if (callback) callback(); };
            }).catch(e => { if (callback) callback(); });
        }

        function inputNumber(num) {
            if (isAnswered) return;
            if (userInputString.length >= 2) return;
            userInputString += num.toString();
            updateInputDisplay();

            const prob = problemsQueue[currentMultiplierIndex];
            const correctAnswer = prob.a * prob.b;
            const userAns = parseInt(userInputString, 10);
            const targetLength = correctAnswer >= 10 ? 2 : 1;

            if (userInputString.length === targetLength) {
                if (userAns === correctAnswer) {
                    isAnswered = true;
                    showPopup("せいかい！");
                    document.getElementById('problem-display').textContent = `${prob.a} × ${prob.b} ＝ ${correctAnswer}`;
                    document.getElementById('kana-display').textContent = kukuData[prob.a][prob.b].first + kukuData[prob.a][prob.b].second;

                    const monsterEl = document.getElementById('monster-emoji');
                    monsterEl.classList.add('hit');

                    playSecondAudio(() => {
                        currentMultiplierIndex++;
                        monsterEl.classList.remove('hit');
                        if (currentMultiplierIndex >= 9) {
                            completeStage();
                        } else {
                            loadCurrentProblem();
                        }
                    });
                } else {
                    showPopup("ざんねん！");
                    userInputString = "";
                    updateInputDisplay();
                }
            }
        }

        function clearInput() {
            if (isAnswered) return;
            userInputString = "";
            updateInputDisplay();
        }

        function updateInputDisplay() {
            document.getElementById('user-input-display').textContent = userInputString === "" ? "-" : userInputString;
        }

        function showPopup(text) {
            const popup = document.getElementById('popup-msg');
            popup.textContent = text;
            popup.classList.add('show');
            setTimeout(() => { popup.classList.remove('show'); }, 600);
        }

        function completeStage() {
            const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('clear-time-display').textContent = `${elapsedTime}秒`;

            if (!saveData.clearedStages.includes(currentStage)) {
                saveData.clearedStages.push(currentStage);
            }
            const currentIdx = STAGE_ORDER.indexOf(currentStage);
            if (currentIdx < STAGE_ORDER.length - 1) {
                const nextStageNum = STAGE_ORDER[currentIdx + 1];
                if (!saveData.unlockedStages.includes(nextStageNum)) {
                    saveData.unlockedStages.push(nextStageNum);
                }
            }
            localStorage.setItem('kuku_save_data', JSON.stringify(saveData));
            switchScreen('result-screen');
        }

        // --- 練習モード (準備) ---
        function showPracticeStageSelect() {
            playBGM('home');
            const container = document.getElementById('practice-stage-list-container');
            container.innerHTML = '';
            for (let s = 1; s <= 9; s++) {
                const btn = document.createElement('div');
                btn.className = 'stage-item unlocked';
                btn.textContent = `${s}の段のじゅんびをする`;
                btn.onclick = () => startPractice(s);
                container.appendChild(btn);
            }
            switchScreen('practice-stage-select-screen');
        }

        function startPractice(stageNum) {
            practiceStage = stageNum;
            practiceIndex = 0;
            flashcardState = 0;
            playBGM('practice');

            document.getElementById('practice-stage-title').textContent = `${practiceStage}の段`;
            switchScreen('practice-screen');
            updateFlashcardDisplay();
            playPracticeCurrentAudio();
        }

        function updateFlashcardDisplay() {
            const b = practiceIndex + 1;
            const data = kukuData[practiceStage][b];
            document.getElementById('practice-counter').textContent = `${practiceIndex + 1}/9`;

            if (flashcardState === 0) {
                document.getElementById('practice-kana').textContent = data.first;
                document.getElementById('practice-main').textContent = `${practiceStage} × ${b}`;
            } else {
                document.getElementById('practice-kana').textContent = data.second;
                document.getElementById('practice-main').textContent = practiceStage * b;
            }
        }

        function playPracticeCurrentAudio() {
            const b = practiceIndex + 1;
            const filename = flashcardState === 0 ? `${practiceStage}-${b}_1.wav` : `${practiceStage}-${b}_2.wav`;
            const audioPath = `audio/${filename}`;
            if (currentAudio) { currentAudio.pause(); }
            currentAudio = new Audio(audioPath);
            currentAudio.play().catch(e => {});
        }

        function onFlashcardClick() {
            if (flashcardState === 0) {
                flashcardState = 1;
                updateFlashcardDisplay();
                playPracticeCurrentAudio();
            } else {
                practiceIndex++;
                if (practiceIndex >= 9) {
                    alert(`${practiceStage}の段のじゅんびかんりょう！`);
                    showPracticeStageSelect();
                } else {
                    flashcardState = 0;
                    updateFlashcardDisplay();
                    playPracticeCurrentAudio();
                }
            }
        }
    </script>
</body>
</html>
