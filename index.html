<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九のぼうけん - かけ算バトルRPG</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --bg: #1A202C;
            --card-bg: #FFFFFF;
            --text: #2D3748;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px 20px;
            text-align: center;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 2.3rem;
            color: #1A365D;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #718096;
            margin-bottom: 25px;
        }

        .start-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 22px 36px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            margin-top: 20px;
        }

        .adventure-btn {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
        }

        .stage-title {
            font-size: 1.6rem;
            color: #1A365D;
            margin-bottom: 15px;
        }

        .stage-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .stage-item {
            background-color: #EDF2F7;
            border: none;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2D3748;
            text-align: left;
        }

        .stage-item.unlocked {
            background-color: #E6FFFA;
            color: #234E52;
            border: 2px solid var(--secondary);
        }

        .stage-item.locked {
            background-color: #E2E8F0;
            color: #A0AEC0;
            cursor: not-allowed;
        }

        .stage-item.cleared::after {
            content: " ⭐クリア";
            color: #D69E2E;
            font-size: 1rem;
        }

        .battle-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: #718096;
        }

        .back-home-btn {
            background: none;
            border: none;
            color: #718096;
            font-size: 1rem;
            cursor: pointer;
        }

        .monster-container {
            margin: 10px 0;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .monster-avatar {
            font-size: 4rem;
            animation: bounce 1.5s infinite ease-in-out;
            transition: transform 0.3s, filter 0.3s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .monster-avatar.attacked {
            transform: scale(1.2) rotate(10deg);
            filter: grayscale(100%);
        }

        .progress-bar-bg {
            width: 100%;
            background-color: #E2E8F0;
            height: 10px;
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .problem-card {
            background: #F7F9FC;
            width: 100%;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .problem-text {
            font-size: 2.6rem;
            font-weight: 900;
            color: #1A365D;
        }

        .kana-display {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 4px;
            transition: opacity 0.2s;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .key-btn {
            background-color: #EDF2F7;
            border: none;
            padding: 14px 0;
            font-size: 1.6rem;
            font-weight: bold;
            color: #2D3748;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: background-color 0.1s, transform 0.1s;
        }

        .key-btn:active {
            transform: scale(0.93);
            background-color: #CBD5E0;
        }

        .key-btn.clear {
            background-color: #FED7D7;
            color: #C53030;
            grid-column: span 2;
        }

        .control-row {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .sub-action-btn {
            background: #E2E8F0;
            border: none;
            padding: 8px 14px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #4A5568;
            border-radius: 10px;
            cursor: pointer;
        }

        .result-title {
            font-size: 2rem;
            color: #D69E2E;
            margin-bottom: 10px;
        }

        .result-stats {
            font-size: 1.2rem;
            color: #4A5568;
            margin: 20px 0;
            line-height: 1.6;
            background: #F7F9FC;
            padding: 15px;
            border-radius: 16px;
            width: 100%;
        }

        .time-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2B6CB0;
        }

        .action-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 16px 25px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 15px rgba(78, 205, 196, 0.4);
            margin-top: 10px;
        }

        #popup-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background-color: rgba(255, 107, 107, 0.95);
            color: white;
            font-size: 2.5rem;
            font-weight: 900;
            padding: 18px 35px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            z-index: 2000;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        #popup-msg.show {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <div id="popup-msg">せいかい！🎉</div>

    <div id="start-screen" class="screen active">
        <h1>かけ算九九を はじめよう！</h1>
        <p class="subtitle">音声をオンにしてぼうけんに出かけよう</p>
        <div style="font-size: 4rem; margin: 10px 0;">🔊✨</div>
        <button class="start-btn" onclick="initAudioAndStart()">音声をONにして<br>はじめる</button>
    </div>

    <div id="home-screen" class="screen">
        <h1>九九のぼうけん</h1>
        <p class="subtitle">モンスターをたおして九九をきわめよう！</p>
        <div style="font-size: 4.5rem; margin: 15px 0;">🏰⚔️</div>
        <button class="adventure-btn" onclick="showStageSelect()">ぼうけんに出る</button>
    </div>

    <div id="stage-select-screen" class="screen">
        <div class="battle-header">
            <button class="back-home-btn" onclick="showHome()">＜ ホーム</button>
            <span>ステージを選ぼう</span>
            <span style="width: 40px;"></span>
        </div>
        <h2 class="stage-title" style="margin-top: 10px;">九九のぼうけんの森</h2>
        <div class="stage-list" id="stage-list-container"></div>
    </div>

    <div id="battle-screen" class="screen">
        <div class="battle-header">
            <button class="back-home-btn" onclick="showStageSelect()">＜ やめる</button>
            <span id="current-stage-title">2の段</span>
            <span id="question-counter">1 / 9</span>
        </div>

        <div class="monster-container">
            <div class="monster-avatar" id="monster-emoji">🐲</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="battle-progress"></div>
            </div>
        </div>

        <div class="problem-card">
            <!-- 問題の上にひらがな読みを表示 -->
            <div class="kana-display" id="kana-first">にいちが</div>
            <div class="problem-text" id="problem-display">2 × 1</div>
        </div>

        <div style="background: #2D3748; color: #FFF; width: 100%; padding: 10px; border-radius: 12px; font-size: 1.8rem; font-weight: bold; margin-bottom: 10px; letter-spacing: 4px; min-height: 50px; display: flex; justify-content: center; align-items: center;" id="user-input-display">
            -
        </div>

        <div class="keypad">
            <button class="key-btn" onclick="inputNumber(1)">1</button>
            <button class="key-btn" onclick="inputNumber(2)">2</button>
            <button class="key-btn" onclick="inputNumber(3)">3</button>
            <button class="key-btn" onclick="inputNumber(4)">4</button>
            <button class="key-btn" onclick="inputNumber(5)">5</button>
            <button class="key-btn" onclick="inputNumber(6)">6</button>
            <button class="key-btn" onclick="inputNumber(7)">7</button>
            <button class="key-btn" onclick="inputNumber(8)">8</button>
            <button class="key-btn" onclick="inputNumber(9)">9</button>
            <button class="key-btn clear" onclick="clearInput()">けす</button>
            <button class="key-btn" onclick="inputNumber(0)">0</button>
        </div>

        <div class="control-row">
            <button class="sub-action-btn" onclick="playFirstAudio()">🔊 もういちど きく</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h2 class="result-title">ステージクリア！</h2>
        <div style="font-size: 3.5rem;">🏆✨</div>
        <div class="result-stats">
            かかった時間<br>
            <span class="time-display" id="clear-time-display">0秒</span>
        </div>
        <button class="action-btn" onclick="showStageSelect()">ステージいちらんへ</button>
    </div>

    <script>
        // 正しい読み方データを内蔵
        const kukuData = {
            1: {
                1: { first: "いんいちが", second: "いち" },
                2: { first: "いちにが", second: "に" },
                3: { first: "いちさんが", second: "さん" },
                4: { first: "いちしが", second: "し" },
                5: { first: "いちごが", second: "ご" },
                6: { first: "いちろくが", second: "ろく" },
                7: { first: "いちしちが", second: "しち" },
                8: { first: "いちはちが", second: "はち" },
                9: { first: "いんくが", second: "く" }
            },
            2: {
                1: { first: "にいちが", second: "に" },
                2: { first: "ににんが", second: "し" },
                3: { first: "にさんが", second: "ろく" },
                4: { first: "にしが", second: "はち" },
                5: { first: "にご", second: "じゅう" },
                6: { first: "にろく", second: "じゅうに" },
                7: { first: "にしち", second: "じゅうし" },
                8: { first: "にはち", second: "じゅうろく" },
                9: { first: "にく", second: "じゅうはち" }
            },
            3: {
                1: { first: "さんいちが", second: "さん" },
                2: { first: "さんにが", second: "ろく" },
                3: { first: "さざんが", second: "く" },
                4: { first: "さんし", second: "じゅうに" },
                5: { first: "さんご", second: "じゅうご" },
                6: { first: "さぶろく", second: "じゅうはち" },
                7: { first: "さんしち", second: "にじゅういち" },
                8: { first: "さんぱ", second: "にじゅうし" },
                9: { first: "さんく", second: "にじゅうしち" }
            },
            4: {
                1: { first: "しいちが", second: "し" },
                2: { first: "しにが", second: "はち" },
                3: { first: "しさん", second: "じゅうに" },
                4: { first: "しし", second: "じゅうろく" },
                5: { first: "しご", second: "にじゅう" },
                6: { first: "しろく", second: "にじゅうし" },
                7: { first: "ししち", second: "にじゅうはち" },
                8: { first: "しは", second: "さんじゅうに" },
                9: { first: "しく", second: "さんじゅうろく" }
            },
            5: {
                1: { first: "ごいちが", second: "ご" },
                2: { first: "ごに", second: "じゅう" },
                3: { first: "ごさん", second: "じゅうご" },
                4: { first: "ごし", second: "にじゅう" },
                5: { first: "ごご", second: "にじゅうご" },
                6: { first: "ごろく", second: "さんじゅう" },
                7: { first: "ごしち", second: "さんじゅうご" },
                8: { first: "ごは", second: "しじゅう" },
                9: { first: "ごっく", second: "しじゅうご" }
            },
            6: {
                1: { first: "ろくいちが", second: "ろく" },
                2: { first: "ろくに", second: "じゅうに" },
                3: { first: "ろくさん", second: "じゅうはち" },
                4: { first: "ろくし", second: "にじゅうし" },
                5: { first: "ろくご", second: "さんじゅう" },
                6: { first: "ろくろく", second: "さんじゅうろく" },
                7: { first: "ろくしち", second: "しじゅうに" },
                8: { first: "ろくは", second: "しじゅうはち" },
                9: { first: "ろっく", second: "ごじゅうし" }
            },
            7: {
                1: { first: "しちいちが", second: "しち" },
                2: { first: "しちに", second: "じゅうし" },
                3: { first: "しちさん", second: "にじゅういち" },
                4: { first: "しちし", second: "にじゅうはち" },
                5: { first: "しちご", second: "さんじゅうご" },
                6: { first: "しちろく", second: "しじゅうに" },
                7: { first: "しちしち", second: "しじゅうく" },
                8: { first: "しちは", second: "ごじゅうろく" },
                9: { first: "しちく", second: "ろくじゅうさん" }
            },
            8: {
                1: { first: "はちいちが", second: "はち" },
                2: { first: "はちに", second: "じゅうろく" },
                3: { first: "はちさん", second: "にじゅうし" },
                4: { first: "はちし", second: "さんじゅうに" },
                5: { first: "はちご", second: "しじゅう" },
                6: { first: "はちろく", second: "しじゅうはち" },
                7: { first: "はちしち", second: "ごじゅうろく" },
                8: { first: "はっぱ", second: "ろくじゅうし" },
                9: { first: "はっく", second: "しちじゅうに" }
            },
            9: {
                1: { first: "くいちが", second: "く" },
                2: { first: "くに", second: "じゅうはち" },
                3: { first: "くさん", second: "にじゅうしち" },
                4: { first: "くし", second: "さんじゅうろく" },
                5: { first: "くご", second: "しじゅうご" },
                6: { first: "くろく", second: "ごじゅうし" },
                7: { first: "くしち", second: "ろくじゅうさん" },
                8: { first: "くは", second: "しちじゅうに" },
                9: { first: "くく", second: "はちじゅういち" }
            }
        };

        const STAGE_ORDER = [1, 2, 5, 3, 4, 6, 7, 8, 9];
        const STAGE_NAMES = {
            1: "1の段 (はじまりの原っぱ)",
            2: "2の段 (はじまりの森)",
            5: "5の段 (しずかな平原)",
            3: "3の段 (いばらの林)",
            4: "4の段 (まがった洞窟)",
            6: "6の段 (大きな山道)",
            7: "7の段 (ひみつの谷)",
            8: "8の段 (吹雪の雪原)",
            9: "9の段 (竜の城門)"
        };
        const MONSTER_ICONS = ["🟡", "🟢", "👺", "💀", "👻", "👹", "🗿", "🦅", "🐲"];

        let saveData = JSON.parse(localStorage.getItem('kuku_save_data')) || {
            unlockedStages: [1],
            clearedStages: []
        };

        let currentStage = 1;
        let currentMultiplierIndex = 0;
        let currentAudio = null;
        let startTime = 0;
        let userInputString = "";
        let problemsQueue = [];

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function initAudioAndStart() {
            let dummy = new Audio();
            dummy.play().catch(() => {});
            showHome();
        }

        function showHome() {
            switchScreen('home-screen');
        }

        function showStageSelect() {
            renderStageList();
            switchScreen('stage-select-screen');
        }

        function renderStageList() {
            const container = document.getElementById('stage-list-container');
            container.innerHTML = '';

            STAGE_ORDER.forEach((stageNum) => {
                const isUnlocked = saveData.unlockedStages.includes(stageNum);
                const isCleared = saveData.clearedStages.includes(stageNum);

                const btn = document.createElement('button');
                btn.className = `stage-item ${isUnlocked ? 'unlocked' : 'locked'} ${isCleared ? 'cleared' : ''}`;
                
                let label = `${STAGE_NAMES[stageNum]}`;
                if (!isUnlocked) {
                    label += " 🔒";
                }

                btn.textContent = label;
                
                if (isUnlocked) {
                    btn.onclick = () => startBattle(stageNum);
                } else {
                    btn.onclick = () => alert("前のステージをクリアするとあそべるよ！");
                }

                container.appendChild(btn);
            });
        }

        function startBattle(stageNum) {
            currentStage = stageNum;
            currentMultiplierIndex = 0;
            
            problemsQueue = [];
            for (let b = 1; b <= 9; b++) {
                problemsQueue.push({ a: currentStage, b: b });
            }

            document.getElementById('current-stage-title').textContent = STAGE_NAMES[currentStage].split(' ')[0];
            
            const stageIdx = STAGE_ORDER.indexOf(currentStage);
            document.getElementById('monster-emoji').textContent = MONSTER_ICONS[stageIdx] || "🐲";
            document.getElementById('monster-emoji').classList.remove('attacked');

            switchScreen('battle-screen');
            startTime = Date.now();
            
            loadCurrentProblem();
        }

        function loadCurrentProblem() {
            userInputString = "";
            updateInputDisplay();

            const prob = problemsQueue[currentMultiplierIndex];
            document.getElementById('question-counter').textContent = `${currentMultiplierIndex + 1} / 9`;

            const progressPercent = (currentMultiplierIndex / 9) * 100;
            document.getElementById('battle-progress').style.width = `${progressPercent}%`;

            document.getElementById('problem-display').textContent = `${prob.a} × ${prob.b}`;

            if (kukuData[prob.a] && kukuData[prob.a][prob.b]) {
                const data = kukuData[prob.a][prob.b];
                document.getElementById('kana-first').textContent = data.first;
            } else {
                document.getElementById('kana-first').textContent = `${prob.a} × ${prob.b}`;
            }

            playFirstAudio();
        }

        function playFirstAudio() {
            const prob = problemsQueue[currentMultiplierIndex];
            const audioPath = `audio/${prob.a}-${prob.b}_1.wav`;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            currentAudio = new Audio(audioPath);
            const firstPart = document.getElementById('kana-first');

            currentAudio.play().then(() => {
                firstPart.style.opacity = "0.5";
                currentAudio.onended = () => {
                    firstPart.style.opacity = "1";
                };
            }).catch(e => {
                console.warn("前半の音声ファイルがありません:", audioPath);
            });
        }

        function playSequenceAudio(callback) {
            const prob = problemsQueue[currentMultiplierIndex];
            const path1 = `audio/${prob.a}-${prob.b}_1.wav`;
            const path2 = `audio/${prob.a}-${prob.b}_2.wav`;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const firstPart = document.getElementById('kana-first');

            let audio1 = new Audio(path1);
            currentAudio = audio1;

            audio1.play().then(() => {
                audio1.onended = () => {
                    let audio2 = new Audio(path2);
                    currentAudio = audio2;
                    audio2.play().then(() => {
                        audio2.onended = () => {
                            if (callback) callback();
                        };
                    }).catch(e => {
                        if (callback) callback();
                    });
                };
            }).catch(e => {
                let audio2 = new Audio(path2);
                currentAudio = audio2;
                audio2.play().then(() => {
                    audio2.onended = () => {
                        if (callback) callback();
                    };
                }).catch(err => {
                    if (callback) callback();
                });
            });
        }

        function inputNumber(num) {
            if (userInputString.length >= 2) return;
            userInputString += num.toString();
            updateInputDisplay();

            const prob = problemsQueue[currentMultiplierIndex];
            const correctAnswer = prob.a * prob.b;
            const userAns = parseInt(userInputString, 10);

            // 1桁の答えなら1文字入力時、2桁の答えなら2文字入力時に自動判定
            const targetLength = correctAnswer >= 10 ? 2 : 1;

            if (userInputString.length === targetLength) {
                if (userAns === correctAnswer) {
                    showPopup("せいかい！🎉");
                    
                    const monsterEl = document.getElementById('monster-emoji');
                    monsterEl.classList.add('attacked');

                    playSequenceAudio(() => {
                        currentMultiplierIndex++;
                        monsterEl.classList.remove('attacked');
                        
                        if (currentMultiplierIndex >= 9) {
                            completeStage();
                        } else {
                            loadCurrentProblem();
                        }
                    });

                } else {
                    showPopup("ざんねん！");
                    userInputString = "";
                    updateInputDisplay();
                }
            }
        }

        function clearInput() {
            userInputString = "";
            updateInputDisplay();
        }

        function updateInputDisplay() {
            const display = document.getElementById('user-input-display');
            display.textContent = userInputString === "" ? "-" : userInputString;
        }

        function showPopup(text) {
            const popup = document.getElementById('popup-msg');
            popup.textContent = text;
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 700);
        }

        function completeStage() {
            const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('clear-time-display').textContent = `${elapsedTime}秒`;

            if (!saveData.clearedStages.includes(currentStage)) {
                saveData.clearedStages.push(currentStage);
            }

            const currentIdx = STAGE_ORDER.indexOf(currentStage);
            if (currentIdx < STAGE_ORDER.length - 1) {
                const nextStageNum = STAGE_ORDER[currentIdx + 1];
                if (!saveData.unlockedStages.includes(nextStageNum)) {
                    saveData.unlockedStages.push(nextStageNum);
                }
            }

            localStorage.setItem('kuku_save_data', JSON.stringify(saveData));
            switchScreen('result-screen');
        }
    </script>
</body>
</html>
