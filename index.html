<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九のぼうけん - かけ算バトルRPG</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --bg: #1A202C;
            --card-bg: #FFFFFF;
            --text: #2D3748;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px 20px;
            text-align: center;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* スタート画面専用のレイアウト */
        #start-screen {
            background-color: var(--card-bg);
        }

        h1 {
            font-size: 2.3rem;
            color: #1A365D;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #718096;
            margin-bottom: 25px;
        }

        .start-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 22px 36px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            transition: transform 0.1s;
            margin-top: 20px;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        .adventure-btn {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
            transition: transform 0.1s;
        }

        .adventure-btn:active {
            transform: scale(0.95);
        }

        /* ステージ選択画面 */
        .stage-title {
            font-size: 1.6rem;
            color: #1A365D;
            margin-bottom: 15px;
        }

        .stage-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .stage-item {
            background-color: #EDF2F7;
            border: none;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2D3748;
            text-align: left;
        }

        .stage-item.unlocked {
            background-color: #E6FFFA;
            color: #234E52;
            border: 2px solid var(--secondary);
        }

        .stage-item.locked {
            background-color: #E2E8F0;
            color: #A0AEC0;
            cursor: not-allowed;
        }

        .stage-item.cleared::after {
            content: " ⭐クリア";
            color: #D69E2E;
            font-size: 1rem;
        }

        /* バトル画面 */
        .battle-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: #718096;
        }

        .back-home-btn {
            background: none;
            border: none;
            color: #718096;
            font-size: 1rem;
            cursor: pointer;
        }

        .monster-container {
            margin: 10px 0;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .monster-avatar {
            font-size: 4rem;
            animation: bounce 1.5s infinite ease-in-out;
            transition: transform 0.3s, filter 0.3s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .monster-avatar.attacked {
            transform: scale(1.2) rotate(10deg);
            filter: grayscale(100%);
        }

        .progress-bar-bg {
            width: 100%;
            background-color: #E2E8F0;
            height: 10px;
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .problem-card {
            background: #F7F9FC;
            width: 100%;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .problem-text {
            font-size: 2.8rem;
            font-weight: 900;
            color: #1A365D;
            margin-bottom: 2px;
        }

        .kana-display {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4A5568;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .kana-part {
            transition: color 0.2s;
        }

        .kana-part.highlight {
            color: var(--primary);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .key-btn {
            background-color: #EDF2F7;
            border: none;
            padding: 14px 0;
            font-size: 1.6rem;
            font-weight: bold;
            color: #2D3748;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: background-color 0.1s, transform 0.1s;
        }

        .key-btn:active {
            transform: scale(0.93);
            background-color: #CBD5E0;
        }

        .key-btn.clear {
            background-color: #FED7D7;
            color: #C53030;
        }

        .key-btn.enter {
            background-color: var(--secondary);
            color: white;
        }

        .control-row {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .sub-action-btn {
            background: #E2E8F0;
            border: none;
            padding: 8px 14px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #4A5568;
            border-radius: 10px;
            cursor: pointer;
        }

        /* リザルト画面 */
        .result-title {
            font-size: 2rem;
            color: #D69E2E;
            margin-bottom: 10px;
        }

        .result-stats {
            font-size: 1.2rem;
            color: #4A5568;
            margin: 20px 0;
            line-height: 1.6;
            background: #F7F9FC;
            padding: 15px;
            border-radius: 16px;
            width: 100%;
        }

        .time-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2B6CB0;
        }

        .action-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 16px 25px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 15px rgba(78, 205, 196, 0.4);
            margin-top: 10px;
        }

        /* ポップアップ */
        #popup-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background-color: rgba(255, 107, 107, 0.95);
            color: white;
            font-size: 2.5rem;
            font-weight: 900;
            padding: 18px 35px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            z-index: 2000;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        #popup-msg.show {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <div id="popup-msg">せいかい！🎉</div>

    <!-- 0. 音声有効化スタート画面 -->
    <div id="start-screen" class="screen active">
        <h1>かけ算九九を はじめよう！</h1>
        <p class="subtitle">音声をオンにしてぼうけんに出かけよう</p>
        <div style="font-size: 4rem; margin: 10px 0;">🔊✨</div>
        <button class="start-btn" onclick="initAudioAndStart()">音声をONにして<br>はじめる</button>
    </div>

    <!-- 1. ホーム画面 -->
    <div id="home-screen" class="screen">
        <h1>九九のぼうけん</h1>
        <p class="subtitle">モンスターをたおして九九をきわめよう！</p>
        <div style="font-size: 4.5rem; margin: 15px 0;">🏰⚔️</div>
        <button class="adventure-btn" onclick="showStageSelect()">ぼうけんに出る</button>
    </div>

    <!-- 2. ステージ選択画面 -->
    <div id="stage-select-screen" class="screen">
        <div class="battle-header">
            <button class="back-home-btn" onclick="showHome()">＜ ホーム</button>
            <span>ステージを選ぼう</span>
            <span style="width: 40px;"></span>
        </div>
        <h2 class="stage-title" style="margin-top: 10px;">ジュンバンレンシュウの森</h2>
        <div class="stage-list" id="stage-list-container"></div>
    </div>

    <!-- 3. バトル画面 -->
    <div id="battle-screen" class="screen">
        <div class="battle-header">
            <button class="back-home-btn" onclick="showStageSelect()">＜ やめる</button>
            <span id="current-stage-title">2の段</span>
            <span id="question-counter">1 / 9</span>
        </div>

        <div class="monster-container">
            <div class="monster-avatar" id="monster-emoji">🐲</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="battle-progress"></div>
            </div>
        </div>

        <div class="problem-card">
            <div class="problem-text" id="problem-display">2 × 1</div>
            <div class="kana-display">
                <span class="kana-part" id="kana-first">にいちが</span>
                <span class="kana-part" id="kana-second">に</span>
            </div>
        </div>

        <div style="background: #2D3748; color: #FFF; width: 100%; padding: 10px; border-radius: 12px; font-size: 1.8rem; font-weight: bold; margin-bottom: 10px; letter-spacing: 4px; min-height: 50px; display: flex; justify-content: center; align-items: center;" id="user-input-display">
            -
        </div>

        <div class="keypad">
            <button class="key-btn" onclick="inputNumber(1)">1</button>
            <button class="key-btn" onclick="inputNumber(2)">2</button>
            <button class="key-btn" onclick="inputNumber(3)">3</button>
            <button class="key-btn" onclick="inputNumber(4)">4</button>
            <button class="key-btn" onclick="inputNumber(5)">5</button>
            <button class="key-btn" onclick="inputNumber(6)">6</button>
            <button class="key-btn" onclick="inputNumber(7)">7</button>
            <button class="key-btn" onclick="inputNumber(8)">8</button>
            <button class="key-btn" onclick="inputNumber(9)">9</button>
            <button class="key-btn clear" onclick="clearInput()">けす</button>
            <button class="key-btn" onclick="inputNumber(0)">0</button>
            <button class="key-btn enter" onclick="submitAnswer()">こたえ</button>
        </div>

        <div class="control-row">
            <button class="sub-action-btn" onclick="playCurrentAudio()">🔊 もういちど きく</button>
        </div>
    </div>

    <!-- 4. クリア・リザルト画面 -->
    <div id="result-screen" class="screen">
        <h2 class="result-title">ステージクリア！</h2>
        <div style="font-size: 3.5rem;">🏆✨</div>
        <div class="result-stats">
            かかった時間<br>
            <span class="time-display" id="clear-time-display">0秒</span>
        </div>
        <button class="action-btn" onclick="showStageSelect()">ステージいちらんへ</button>
    </div>

    <script src="kuku.json"></script>
    <script>
        const STAGE_ORDER = [2, 5, 3, 4, 6, 7, 8, 9];
        const STAGE_NAMES = {
            2: "2の段 (はじまりの森)",
            5: "5の段 (しずかな平原)",
            3: "3の段 (いばらの林)",
            4: "4の段 (まがった洞窟)",
            6: "6の段 (大きな山道)",
            7: "7の段 (ひみつの谷)",
            8: "8の段 (吹雪の雪原)",
            9: "9の段 (竜の城門)"
        };
        const MONSTER_ICONS = ["🟢", "👺", "💀", "👻", "👹", "🗿", "🦅", "🐲"];

        let saveData = JSON.parse(localStorage.getItem('kuku_save_data')) || {
            unlockedStages: [2],
            clearedStages: []
        };

        let currentStage = 2;
        let currentMultiplierIndex = 0;
        let currentAudio = null;
        let startTime = 0;
        let userInputString = "";
        let problemsQueue = [];

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function initAudioAndStart() {
            // ブラウザの音声制限を解除するため空のオーディオを再生
            let dummy = new Audio();
            dummy.play().catch(() => {});
            showHome();
        }

        function showHome() {
            switchScreen('home-screen');
        }

        function showStageSelect() {
            renderStageList();
            switchScreen('stage-select-screen');
        }

        function renderStageList() {
            const container = document.getElementById('stage-list-container');
            container.innerHTML = '';

            STAGE_ORDER.forEach((stageNum) => {
                const isUnlocked = saveData.unlockedStages.includes(stageNum);
                const isCleared = saveData.clearedStages.includes(stageNum);

                const btn = document.createElement('button');
                btn.className = `stage-item ${isUnlocked ? 'unlocked' : 'locked'} ${isCleared ? 'cleared' : ''}`;
                
                let label = `${STAGE_NAMES[stageNum]}`;
                if (!isUnlocked) {
                    label += " 🔒";
                }

                btn.textContent = label;
                
                if (isUnlocked) {
                    btn.onclick = () => startBattle(stageNum);
                } else {
                    btn.onclick = () => alert("前のステージをクリアするとあそべるよ！");
                }

                container.appendChild(btn);
            });
        }

        function startBattle(stageNum) {
            currentStage = stageNum;
            currentMultiplierIndex = 0;
            
            problemsQueue = [];
            for (let b = 1; b <= 9; b++) {
                problemsQueue.push({ a: currentStage, b: b });
            }

            document.getElementById('current-stage-title').textContent = STAGE_NAMES[currentStage].split(' ')[0];
            
            const stageIdx = STAGE_ORDER.indexOf(currentStage);
            document.getElementById('monster-emoji').textContent = MONSTER_ICONS[stageIdx] || "🐲";
            document.getElementById('monster-emoji').classList.remove('attacked');

            switchScreen('battle-screen');
            startTime = Date.now();
            
            loadCurrentProblem();
        }

        function loadCurrentProblem() {
            userInputString = "";
            updateInputDisplay();

            const prob = problemsQueue[currentMultiplierIndex];
            document.getElementById('question-counter').textContent = `${currentMultiplierIndex + 1} / 9`;

            const progressPercent = (currentMultiplierIndex / 9) * 100;
            document.getElementById('battle-progress').style.width = `${progressPercent}%`;

            document.getElementById('problem-display').textContent = `${prob.a} × ${prob.b}`;

            if (typeof kukuData !== 'undefined' && kukuData[prob.a] && kukuData[prob.a][prob.b]) {
                const data = kukuData[prob.a][prob.b];
                document.getElementById('kana-first').textContent = data.first;
                document.getElementById('kana-second').textContent = data.second;
            } else {
                document.getElementById('kana-first').textContent = `${prob.a} × ${prob.b}`;
                document.getElementById('kana-second').textContent = '';
            }

            playCurrentAudio();
        }

        function playCurrentAudio() {
            const prob = problemsQueue[currentMultiplierIndex];
            const audioPath = `audio/${prob.a}-${prob.b}.wav`;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            currentAudio = new Audio(audioPath);
            const firstPart = document.getElementById('kana-first');
            const secondPart = document.getElementById('kana-second');

            currentAudio.play().then(() => {
                firstPart.classList.add('highlight');
                setTimeout(() => {
                    firstPart.classList.remove('highlight');
                    secondPart.classList.add('highlight');
                }, 600);
                setTimeout(() => {
                    secondPart.classList.remove('highlight');
                }, 1400);
            }).catch(e => {
                console.warn("音声ファイルがありません:", audioPath);
            });
        }

        function inputNumber(num) {
            if (userInputString.length >= 2) return;
            userInputString += num.toString();
            updateInputDisplay();
        }

        function clearInput() {
            userInputString = "";
            updateInputDisplay();
        }

        function updateInputDisplay() {
            const display = document.getElementById('user-input-display');
            display.textContent = userInputString === "" ? "-" : userInputString;
        }

        function submitAnswer() {
            if (userInputString === "") return;

            const prob = problemsQueue[currentMultiplierIndex];
            const correctAnswer = prob.a * prob.b;
            const userAns = parseInt(userInputString, 10);

            if (userAns === correctAnswer) {
                showPopup("せいかい！🎉");
                
                const monsterEl = document.getElementById('monster-emoji');
                monsterEl.classList.add('attacked');

                currentMultiplierIndex++;

                setTimeout(() => {
                    monsterEl.classList.remove('attacked');
                    if (currentMultiplierIndex >= 9) {
                        completeStage();
                    } else {
                        loadCurrentProblem();
                    }
                }, 500);

            } else {
                showPopup("ざんねん！もういちど");
                userInputString = "";
                updateInputDisplay();
            }
        }

        function showPopup(text) {
            const popup = document.getElementById('popup-msg');
            popup.textContent = text;
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 800);
        }

        function completeStage() {
            const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('clear-time-display').textContent = `${elapsedTime}秒`;

            if (!saveData.clearedStages.includes(currentStage)) {
                saveData.clearedStages.push(currentStage);
            }

            const currentIdx = STAGE_ORDER.indexOf(currentStage);
            if (currentIdx < STAGE_ORDER.length - 1) {
                const nextStageNum = STAGE_ORDER[currentIdx + 1];
                if (!saveData.unlockedStages.includes(nextStageNum)) {
                    saveData.unlockedStages.push(nextStageNum);
                }
            }

            localStorage.setItem('kuku_save_data', JSON.stringify(saveData));
            switchScreen('result-screen');
        }
    </script>
</body>
</html>
