<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>九九マスター！算数わくわくゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="app">
    <!-- タイトル画面 -->
    <div id="screen-home">
        <div class="icon-header">📚✨</div>
        <h1>九九マスター大冒険</h1>
        <p>正しいリズムと音声で<br>九九を楽しく覚えましょう</p>
        <button class="btn btn-primary" onclick="startMeaningScreen()">はじめから（意味の理解）</button>
        <br>
        <button class="btn btn-stage" onclick="startStageSelect()" style="width: auto; padding: 15px 30px;">ステージを選ぶ</button>
    </div>

    <!-- 1. かけ算の意味の理解画面 -->
    <div id="screen-meaning" class="hidden">
        <h1>🍎 かけ算の意味を知ろう 🍎</h1>
        <p id="meaning-text">「2つの お皿」に「3個ずつ」りんごが乗っています。<br>りんごのぜんぶの数はいくつかな？</p>
        <div id="meaning-visual" style="font-size: 40px; margin: 20px;">🍎🍎 🍎🍎 🍎🍎</div>
        <p style="font-size: 18px; font-weight: bold; color: #27ae60;">「 2 × 3 」は 「 2が 3つ分 」という意味だよ！</p>
        <button class="btn btn-primary" onclick="nextMeaningStep()">次へ進む</button>
    </div>

    <!-- ステージ選択画面 -->
    <div id="screen-stages" class="hidden">
        <h1>🗺️ ステージを選んでね</h1>
        <div class="stage-grid">
            <button class="btn btn-stage" onclick="startStage(2)">2の段</button>
            <button class="btn btn-stage" onclick="startStage(5)">5の段</button>
            <button class="btn btn-stage" onclick="startStage(3)">3の段</button>
            <button class="btn btn-stage" onclick="startStage(4)">4の段</button>
            <button class="btn btn-stage" onclick="startStage(6)">6の段</button>
            <button class="btn btn-stage" onclick="startStage(7)">7の段</button>
            <button class="btn btn-stage" onclick="startStage(8)">8の段</button>
            <button class="btn btn-stage" onclick="startStage(9)">9の段</button>
            <button class="btn btn-stage" onclick="startStage(1)">1の段</button>
        </div>
        <br>
        <button class="btn" onclick="goHome()" style="background-color: #95a5a6; color:white;">ホームに戻る</button>
    </div>

    <!-- ゲームプレイ画面 -->
    <div id="screen-game" class="hidden">
        <div class="score-board" id="score-board">もんだい 1 / 5</div>
        <div id="problem-display">2 × 5 = ?</div>
        
        <!-- 音声をもう一度聞くボタン -->
        <button class="btn-replay" onclick="playCurrentAudio()">🔊 もう一度聞く</button>
        
        <!-- 音声認識（マイク）エリア -->
        <div style="margin-bottom: 15px;">
            <button id="mic-btn" class="btn" style="background-color: #e74c3c; font-size: 16px; padding: 10px 20px;" onclick="startVoiceInput()">🎤 マイクで唱える</button>
            <p id="recognition-status" style="font-size: 15px; color: #7f8c8d; margin-top: 5px;">ボタンを押して「にくじゅうはち」のように唱えてね</p>
        </div>
        
        <p id="hint-text" style="font-size: 20px; color: #e67e22; font-weight: bold; min-height: 30px;"></p>
        
        <div class="grid" id="choices-container"></div>
    </div>

    <!-- ステージクリア画面 -->
    <div id="screen-clear" class="hidden">
        <div class="icon-header">🎉</div>
        <h1>おめでとうございます！</h1>
        <p id="clear-message">よくがんばりました！</p>
        <button class="btn btn-primary" onclick="startStageSelect()">ほかの段も挑戦する</button>
        <br>
        <button class="btn" onclick="goHome()" style="background-color: #95a5a6; color:white;">ホームに戻る</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
