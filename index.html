<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔王城の九九クエスト</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        h1 {
            font-size: 1.5rem;
            color: #ffcc00;
            margin-bottom: 20px;
        }
        .info {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .question {
            font-size: 2.5rem;
            margin: 20px 0;
            color: #00ffcc;
        }
        input[type="number"] {
            font-size: 1.5rem;
            width: 120px;
            text-align: center;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: #333;
            color: #fff;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff6666;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            height: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container" id="game-container">
    <h1>魔王城の九九クエスト</h1>
    <div class="info" id="level-info">レベル 1</div>
    <div class="info" id="score-info">スコア: 0 / 10</div>
    <div class="question" id="question-text">? × ?</div>
    <div id="quiz-area">
        <input type="number" id="answer-input" autofocus autocomplete="off">
        <br>
        <button onclick="checkAnswer()">こうげき！</button>
    </div>
    <div id="message"></div>
</div>

<script>
    let currentLevel = 1;
    let currentScore = 0;
    let currentQuestionCount = 0;
    const MAX_QUESTIONS_PER_LEVEL = 10; // 現在の問題数を維持
    let currentA = 0;
    let currentB = 0;

    const levelInfo = document.getElementById('level-info');
    const scoreInfo = document.getElementById('score-info');
    const questionText = document.getElementById('question-text');
    const answerInput = document.getElementById('answer-input');
    const message = document.getElementById('message');

    // レベルごとの出題段の定義
    function getTablesForLevel(level) {
        if (level === 1) return [1, 2, 5];
        if (level === 2) return [2, 5, 3];
        if (level === 3) return [4, 5, 3];
        if (level === 4) return [3, 6, 4];
        if (level === 5) return [7, 6, 4];
        if (level === 6) return [7, 6, 8];
        if (level === 7) return [8, 6, 4, 7];
        
        // レベル8以上：6〜8多め、9わりと、1〜5少しずつ
        const pool = [
            1, 2, 3, 4, 5, // 少しずつ
            9, 9,          // わりと (重み付け)
            6, 6, 6,       // 多め
            7, 7, 7,       // 多め
            8, 8, 8        // 多め
        ];
        return pool;
    }

    function getRandomElement(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateQuestion() {
        if (currentQuestionCount >= MAX_QUESTIONS_PER_LEVEL) {
            // レベルクリア処理
            currentLevel++;
            currentQuestionCount = 0;
            message.style.color = "#00ffcc";
            message.innerText = `レベルアップ！ 次は レベル ${currentLevel} だ！`;
            setTimeout(nextLevelStart, 1500);
            return;
        }

        const tables = getTablesForLevel(currentLevel);
        
        if (currentLevel >= 8) {
            // レベル8以上はプールから段を選ぶ
            currentA = getRandomElement(tables);
        } else {
            // レベル1〜7は指定された配列からランダムに選ぶ
            currentA = getRandomElement(tables);
        }
        
        // かける数は 1〜9 の中からランダム
        currentB = Math.floor(Math.random() * 9) + 1;

        questionText.innerText = `${currentA} × ${currentB}`;
        answerInput.value = '';
        answerInput.focus();
        levelInfo.innerText = `レベル ${currentLevel}`;
        scoreInfo.innerText = `もんだい: ${currentQuestionCount + 1} / ${MAX_QUESTIONS_PER_LEVEL}`;
        message.innerText = '';
    }

    function nextLevelStart() {
        generateQuestion();
    }

    function checkAnswer() {
        const userAnswer = parseInt(answerInput.value, 10);
        const correctAnswer = currentA * currentB;

        if (userAnswer === correctAnswer) {
            currentScore++;
            currentQuestionCount++;
            message.style.color = "#00ff00";
            message.innerText = "せいかい！ 魔王にダメージを与えた！";
            setTimeout(generateQuestion, 1000);
        } else {
            message.style.color = "#ff4444";
            message.innerText = `ざんねん！ 正解は ${correctAnswer} だ！`;
            currentQuestionCount++;
            setTimeout(generateQuestion, 1500);
        }
    }

    // Enterキーでも回答できるようにする
    answerInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    // ゲーム開始
    generateQuestion();
</script>

</body>
</html>
